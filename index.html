<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestão LADO A</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">LA</span>
          <div>
            <strong>LADO A</strong>
            <small>Gestão dos sócios</small>
          </div>
        </div>

        <nav class="nav-list" aria-label="Navegação principal">
          <button class="active" data-view="painel">Painel</button>
          <button data-view="turmas">Turmas e Vagas</button>
          <button data-view="alunos">Alunos</button>
          <button data-view="espera">Lista de Espera</button>
          <button data-view="oficinas">Oficinas</button>
          <button data-view="financeiro">Financeiro</button>
        </nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Unidade LADO A</p>
            <h1 id="pageTitle">Painel</h1>
          </div>
        </header>

        <section class="summary-grid" id="summary"></section>
        <section id="view"></section>
      </section>
    </main>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="drawer" id="drawer" aria-label="Ficha lateral" aria-hidden="true"></aside>
    <div class="toast" id="toast" hidden></div>
    <script type="module">
      const STORAGE_KEY = "lado-a-socios-v2";
      const SUPABASE_URL = "https://acpfzhdswmwyaurhixxt.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjcGZ6aGRzd213eWF1cmhpeHh0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzgyOTUsImV4cCI6MjA5NTY1NDI5NX0.idiype-ATNmzMrXpz_8bTM8Opy9AYzf52-JH8tPTO7g";
      const SUPABASE_STATE_ID = "lado-a-main";
      const originalSetItem = localStorage.setItem.bind(localStorage);
      let saveTimer = null;

      async function supabaseRequest(path, options = {}) {
        const response = await fetch(`${SUPABASE_URL}${path}`, {
          ...options,
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            ...(options.headers || {})
          }
        });
        if (!response.ok) throw new Error(`Supabase ${response.status}`);
        return response;
      }

      async function loadOnlineData() {
        try {
          const response = await supabaseRequest(`/rest/v1/app_state?id=eq.${SUPABASE_STATE_ID}&select=data`, { method: "GET" });
          const rows = await response.json();
          if (Array.isArray(rows) && rows[0]?.data && Object.keys(rows[0].data).length) {
            originalSetItem(STORAGE_KEY, JSON.stringify(rows[0].data));
          }
          window.__ladoAOnline = true;
        } catch {
          window.__ladoAOnline = false;
        }
      }

      async function saveOnlineData(value) {
        try {
          await supabaseRequest("/rest/v1/app_state", {
            method: "POST",
            headers: { Prefer: "resolution=merge-duplicates" },
            body: JSON.stringify({
              id: SUPABASE_STATE_ID,
              data: JSON.parse(value),
              updated_at: new Date().toISOString()
            })
          });
          window.__ladoAOnline = true;
        } catch {
          window.__ladoAOnline = false;
        }
      }

      localStorage.setItem = function patchedSetItem(key, value) {
        originalSetItem(key, value);
        if (key === STORAGE_KEY) {
          window.clearTimeout(saveTimer);
          saveTimer = window.setTimeout(() => saveOnlineData(value), 500);
        }
      };

      await loadOnlineData();
      await import("./app.js");
    </script>
  </body>
</html>
